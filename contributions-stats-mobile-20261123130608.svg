<svg xmlns="http://www.w3.org/2000/svg" width="600" height="510" viewBox="0 0 600 510" role="img" aria-labelledby="title"><title id="title">GitHub contribution totals including public and anonymized private activity</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1527"/><stop offset="1" stop-color="#111e35"/></linearGradient></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.signal{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="600" height="510" rx="19" fill="url(#bg)"/><rect x="1" y="1" width="598" height="508" rx="18" fill="none" stroke="#2d405d"/><text x="28" y="38" font-size="21" fill="#9bb2cd" font-weight="600" letter-spacing="2">CONTRIBUTION RECORD</text><circle class="signal" cx="565" cy="32" r="4" fill="#65e5bf"/><rect x="23" y="65" width="271" height="180" rx="13" fill="#14243a" stroke="#2a405d"/><text x="41" y="94" font-size="20" fill="#a9bed6" font-weight="600" letter-spacing=".7">TOTAL CONTRIBUTIONS</text><text x="40" y="169" font-size="65" fill="#65e5bf" font-weight="750" >375</text><text x="42" y="212" font-size="19" fill="#94abc5" font-weight="400" >Since 2022</text><rect x="306" y="65" width="271" height="180" rx="13" fill="#14243a" stroke="#2a405d"/><text x="324" y="94" font-size="20" fill="#a9bed6" font-weight="600" letter-spacing=".7">CONTRIBUTIONS IN 2026</text><text x="323" y="169" font-size="65" fill="#7fc6ff" font-weight="750" >249</text><text x="325" y="212" font-size="19" fill="#94abc5" font-weight="400" >Year to date</text><rect x="23" y="260" width="271" height="180" rx="13" fill="#14243a" stroke="#2a405d"/><text x="41" y="289" font-size="20" fill="#a9bed6" font-weight="600" letter-spacing=".7">ACTIVE DAYS IN 2026</text><text x="40" y="364" font-size="65" fill="#b49bff" font-weight="750" >71</text><text x="42" y="407" font-size="19" fill="#94abc5" font-weight="400" >Days with a contribution</text><rect x="306" y="260" width="271" height="180" rx="13" fill="#14243a" stroke="#2a405d"/><text x="324" y="289" font-size="20" fill="#a9bed6" font-weight="600" letter-spacing=".7">LONGEST STREAK IN 2026</text><text x="323" y="364" font-size="65" fill="#ffce85" font-weight="750" >17</text><text x="325" y="407" font-size="19" fill="#94abc5" font-weight="400" >Consecutive active days</text><text x="27" y="481" font-size="14" fill="#839dbb" font-weight="400" >Public + private activity  |  Updated 23 Nov 2026, 13:06 UTC</text></svg>