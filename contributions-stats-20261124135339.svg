<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title"><title id="title">GitHub contribution totals including public and anonymized private activity</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1527"/><stop offset="1" stop-color="#111e35"/></linearGradient></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.signal{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="260" rx="19" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="258" rx="18" fill="none" stroke="#2d405d"/><text x="28" y="38" font-size="14" fill="#9bb2cd" font-weight="600" letter-spacing="2">CONTRIBUTION RECORD</text><circle class="signal" cx="1159" cy="32" r="4" fill="#65e5bf"/><rect x="24" y="63" width="276" height="154" rx="13" fill="#14243a" stroke="#2a405d"/><text x="42" y="92" font-size="11" fill="#a9bed6" font-weight="600" letter-spacing=".7">TOTAL CONTRIBUTIONS</text><text x="41" y="160" font-size="61" fill="#65e5bf" font-weight="750" >375</text><text x="43" y="191" font-size="13" fill="#94abc5" font-weight="400" >Since 2022</text><rect x="314" y="63" width="276" height="154" rx="13" fill="#14243a" stroke="#2a405d"/><text x="332" y="92" font-size="11" fill="#a9bed6" font-weight="600" letter-spacing=".7">CONTRIBUTIONS IN 2026</text><text x="331" y="160" font-size="61" fill="#7fc6ff" font-weight="750" >249</text><text x="333" y="191" font-size="13" fill="#94abc5" font-weight="400" >Year to date</text><rect x="604" y="63" width="276" height="154" rx="13" fill="#14243a" stroke="#2a405d"/><text x="622" y="92" font-size="11" fill="#a9bed6" font-weight="600" letter-spacing=".7">ACTIVE DAYS IN 2026</text><text x="621" y="160" font-size="61" fill="#b49bff" font-weight="750" >71</text><text x="623" y="191" font-size="13" fill="#94abc5" font-weight="400" >Days with a contribution</text><rect x="894" y="63" width="276" height="154" rx="13" fill="#14243a" stroke="#2a405d"/><text x="912" y="92" font-size="11" fill="#a9bed6" font-weight="600" letter-spacing=".7">LONGEST STREAK IN 2026</text><text x="911" y="160" font-size="61" fill="#ffce85" font-weight="750" >17</text><text x="913" y="191" font-size="13" fill="#94abc5" font-weight="400" >Consecutive active days</text><text x="27" y="243" font-size="12" fill="#839dbb" font-weight="400" >Public + private activity  |  Updated 24 Nov 2026, 13:53 UTC</text></svg>